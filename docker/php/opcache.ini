opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1       ; Cambiar el valor a 0 para producción
opcache.revalidate_freq=0           ; Eliminar esta línea del código para producción
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
